[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "gins"
version = "0.1.0"
description = "Dataset, replay and outage benchmark tools for the GNSS/INS logger"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gins = "gins.cli:main"

[tool.scikit-build]
wheel.packages = ["gins"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
